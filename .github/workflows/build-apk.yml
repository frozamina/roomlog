name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 Release 需要写权限，默认 token 只有读权限
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # 用仓库里固定的密钥库签名。每次构建的签名指纹都相同，
      # 因此新版本 APK 可以直接覆盖安装旧版本，本地数据保留。
      # 详见 android/app/build.gradle 中 signingConfigs 的注释。
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PverCode=${{ github.run_number }} \
            -PverName=0.1.${{ github.run_number }}

      - name: Rename APK with version
        run: |
          cd android/app/build/outputs/apk/debug
          mv app-debug.apk "juzhi-0.1.${{ github.run_number }}.apk"

      # 硬校验：APK 的实际签名指纹必须等于这个常量，否则构建失败。
      # 这一步存在的意义：如果签名变了，用户覆盖安装会失败、卸载重装会丢数据，
      # 而那种问题在构建日志里看不出任何异常。宁可让构建红掉，也不要发出一个
      # 「能装但装不上」的包。
      # 指纹来自 android/keystore/juzhi.keystore 里的证书，换密钥库时必须同步改这里。
      - name: Assert signing certificate
        run: |
          APK="android/app/build/outputs/apk/debug/juzhi-0.1.${{ github.run_number }}.apk"
          EXPECTED="a88250612302d78ac499fe9d2abce610e0d91b55bde8d971d40983f9a09e5968"

          ls -lh "$APK"
          echo "--- 密钥库指纹 ---"
          keytool -list -v -keystore android/keystore/juzhi.keystore \
            -storetype PKCS12 -storepass juzhi2026 -alias juzhi 2>/dev/null \
            | grep -E "Owner:|SHA256:" || true

          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ] || [ ! -x "$BT/apksigner" ]; then
            echo "::warning::未找到 apksigner，跳过签名校验（这不代表签名正确）"
            exit 0
          fi

          ACTUAL=$("$BT/apksigner" verify --print-certs "$APK" \
                    | grep -oE "SHA-256 digest: [0-9a-fA-F]+" | head -1 | awk '{print $3}' \
                    | tr 'A-F' 'a-f')
          echo "--- APK 实际签名指纹 ---"
          echo "期望: $EXPECTED"
          echo "实际: $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名指纹不符！这个包装不上已安装的旧版本，会要求卸载重装并丢失数据。"
            exit 1
          fi
          echo "✅ 签名一致，可以直接覆盖安装旧版本"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: juzhi-debug-apk
          path: android/app/build/outputs/apk/debug/juzhi-*.apk
          retention-days: 90

      # 固定下载地址（不用登录、不用解压 zip）：
      #   https://github.com/frozamina/roomlog/releases/latest/download/juzhi.apk
      #
      # 只维护一个 tag 为 latest 的 release，每次推送覆盖同名资产，
      # 这样地址永远不变，也不会在 Releases 页面堆出一长串历史版本。
      # 资产文件名必须固定叫 juzhi.apk —— 改名会让上面的地址失效。
      - name: Publish release
        run: |
          cd android/app/build/outputs/apk/debug
          cp "juzhi-0.1.${{ github.run_number }}.apk" juzhi.apk
          ls -lh juzhi.apk

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest juzhi.apk --clobber
          else
            gh release create latest juzhi.apk \
              --title "居志 · 最新构建" \
              --notes "由 GitHub Actions 自动发布。每次推送都会覆盖这个文件，下载 juzhi.apk 直接安装即可，能覆盖旧版本、不丢数据。" \
              --latest
          fi

          # 标题带上版本号，方便一眼看出这个包是哪次构建；tag 也跟着挪到最新提交。
          # 这两步失败不影响 APK 本身，所以不设成硬失败。
          gh release edit latest \
            --title "居志 · 最新构建（0.1.${{ github.run_number }}）" \
            --target "${GITHUB_SHA}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

